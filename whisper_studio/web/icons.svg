<svg xmlns="http://www.w3.org/2000/svg">
  <!-- The only glyphs in the app. Outline, round caps, currentColor;
       stroke width comes from CSS (.ic). play/pause are the only filled ones. -->
  <symbol id="sidebar" viewBox="0 0 16 16">
    <rect x="2.5" y="3.5" width="11" height="9" rx="2"/>
    <path d="M6.5 3.5v9"/>
  </symbol>
  <symbol id="inspector" viewBox="0 0 16 16">
    <rect x="2.5" y="3.5" width="11" height="9" rx="2"/>
    <path d="M9.5 3.5v9"/>
  </symbol>
  <symbol id="search" viewBox="0 0 16 16">
    <circle cx="7" cy="7" r="4.5"/>
    <path d="M10.5 10.5l3 3"/>
  </symbol>
  <symbol id="chev-l" viewBox="0 0 16 16">
    <path d="M10 3.5L5.5 8l4.5 4.5"/>
  </symbol>
  <symbol id="chev-r" viewBox="0 0 16 16">
    <path d="M6 3.5L10.5 8 6 12.5"/>
  </symbol>
  <symbol id="more" viewBox="0 0 16 16">
    <path d="M3.5 8h.01M8 8h.01M12.5 8h.01" stroke-width="2.2"/>
  </symbol>
  <symbol id="close" viewBox="0 0 16 16">
    <path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>
  </symbol>
  <symbol id="check" viewBox="0 0 16 16">
    <path d="M3.5 8.5l3 3 6-7"/>
  </symbol>
  <symbol id="play" viewBox="0 0 20 20">
    <path d="M6.5 4.2v11.6c0 .6.6.9 1.1.6l9-5.8c.5-.3.5-1 0-1.3l-9-5.8c-.5-.3-1.1 0-1.1.7z" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="pause" viewBox="0 0 20 20">
    <rect x="5" y="4" width="3.5" height="12" rx="1" fill="currentColor" stroke="none"/>
    <rect x="11.5" y="4" width="3.5" height="12" rx="1" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="back5" viewBox="0 0 20 20">
    <path d="M4.2 7.5A6.5 6.5 0 1 1 3.5 10.5M4.2 3.5v4h4"/>
    <path d="M12 7.5H9.2l-.3 2.4a2 2 0 1 1-.6 2.8"/>
  </symbol>
  <symbol id="fwd5" viewBox="0 0 20 20">
    <path d="M15.8 7.5A6.5 6.5 0 1 0 16.5 10.5M15.8 3.5v4h-4"/>
    <path d="M12 7.5H9.2l-.3 2.4a2 2 0 1 1-.6 2.8"/>
  </symbol>
</svg>
